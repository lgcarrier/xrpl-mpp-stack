[build-system]
requires = ["editables>=0.5", "hatchling>=1.27,<1.33"]
build-backend = "hatchling.build"

[project]
name = "xrpl-mpp-client"
version = "0.2.0"
description = "Buyer-side Python SDK for XRPL MPP HTTP payments"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Louis-Guillaume Carrier-Bedard", email = "lgcarrier@gmail.com" },
]
keywords = ["xrpl", "mpp", "client", "httpx", "payments"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = [
  "httpx==0.28.1",
  "pydantic>=2,<3",
  "xrpl-py>=5.0,<6",
  "xrpl-mpp-core>=0.2.0,<0.3.0",
]

[project.urls]
Documentation = "https://lgcarrier.github.io/xrpl-mpp-stack/packages/client/"
Source = "https://github.com/lgcarrier/xrpl-mpp-stack/tree/main/packages/client"
Issues = "https://github.com/lgcarrier/xrpl-mpp-stack/issues"
Changelog = "https://github.com/lgcarrier/xrpl-mpp-stack/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/xrpl_mpp_client"]

[tool.hatch.build.hooks.custom]
path = "build_hook.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src/xrpl_mpp_client",
  "/README.md",
  "/LICENSE",
  "/build_hook.py",
]
